<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">Navdeep's identity board</title>
  <desc id="board-desc">Three animated panels show current AI curiosities, an iterative build loop, and a verified technical working set.</desc>
  <defs>
    <pattern id="board-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" stroke="#24364F" stroke-width="1" opacity="0.36"/>
    </pattern>
    <linearGradient id="board-edge" x1="408" y1="0" x2="785" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#57E3C3"/><stop offset="0.52" stop-color="#A99FFF"/><stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <filter id="board-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .signal { transform-box: fill-box; transform-origin: center; animation: signal 4.2s ease-in-out infinite; }
      .signal.two { animation-delay: -1.4s; }
      .signal.three { animation-delay: -2.8s; }
      .flow { stroke-dasharray: 8 10; animation: flow 8s linear infinite; }
      .cursor { animation: cursor 1.1s steps(2, end) infinite; }
      .chip { animation: chip 6s ease-in-out infinite; }
      .chip:nth-child(2n) { animation-delay: -2s; }
      .chip:nth-child(3n) { animation-delay: -4s; }
      @keyframes signal { 0%, 100% { opacity: .42; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes flow { to { stroke-dashoffset: -180; } }
      @keyframes cursor { 50% { opacity: 0; } }
      @keyframes chip { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .flow, .cursor, .chip { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect x="3" y="3" width="1194" height="414" rx="24" fill="#07111F" stroke="#24364F" stroke-width="6"/>
  <rect x="24" y="24" width="1152" height="372" rx="12" fill="url(#board-grid)"/>
  <text x="44" y="58" fill="#8AA0BA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">IDENTITY MAP / LIVE SIGNAL</text>
  <circle class="signal" cx="302" cy="53" r="5" fill="#57E3C3"/>
  <path d="M24 78H1176" stroke="#24364F" stroke-width="2"/>

  <g transform="translate(38 96)">
    <rect width="350" height="278" rx="16" fill="#0B1728" stroke="#2A4260" stroke-width="2"/>
    <text x="24" y="36" fill="#57E3C3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">01 / CURRENT SIGNAL</text>
    <text x="24" y="75" fill="#EDF7F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">What pulls me in</text>
    <g transform="translate(62 132)">
      <path class="flow" d="M0 35L55 0L110 35L55 70L0 35" stroke="#57E3C3" stroke-width="2"/>
      <circle class="signal" cx="0" cy="35" r="9" fill="#07111F" stroke="#57E3C3" stroke-width="3"/>
      <circle class="signal two" cx="55" cy="0" r="9" fill="#07111F" stroke="#A99FFF" stroke-width="3"/>
      <circle class="signal three" cx="110" cy="35" r="9" fill="#07111F" stroke="#FFB86B" stroke-width="3"/>
      <circle class="signal two" cx="55" cy="70" r="12" fill="#07111F" stroke="#EDF7F5" stroke-width="3" filter="url(#board-glow)"/>
      <text x="128" y="7" fill="#A9BAD0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">agent memory</text>
      <text x="128" y="36" fill="#A9BAD0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">retrieval + evals</text>
      <text x="128" y="65" fill="#A9BAD0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">small models + tools</text>
    </g>
    <text x="24" y="248" fill="#607895" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">find the signal / remove the noise</text>
  </g>

  <g transform="translate(410 96)">
    <rect width="350" height="278" rx="16" fill="#0B1728" stroke="#2A4260" stroke-width="2"/>
    <text x="24" y="36" fill="#A99FFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">02 / BUILD LOOP</text>
    <text x="24" y="75" fill="#EDF7F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">How I make things</text>
    <path class="flow" d="M48 135H276M276 135L263 126M276 135L263 144" stroke="url(#board-edge)" stroke-width="3" stroke-linecap="round"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
      <g transform="translate(50 135)"><circle r="22" fill="#102335" stroke="#57E3C3" stroke-width="3"/><text y="4" fill="#EDF7F5">01</text><text y="48" fill="#8AA0BA">QUESTION</text></g>
      <g transform="translate(126 135)"><circle r="22" fill="#102335" stroke="#57E3C3" stroke-width="3"/><text y="4" fill="#EDF7F5">02</text><text y="48" fill="#8AA0BA">PROTOTYPE</text></g>
      <g transform="translate(202 135)"><circle r="22" fill="#102335" stroke="#A99FFF" stroke-width="3"/><text y="4" fill="#EDF7F5">03</text><text y="48" fill="#8AA0BA">MEASURE</text></g>
      <g transform="translate(278 135)"><circle r="22" fill="#102335" stroke="#FFB86B" stroke-width="3" filter="url(#board-glow)"/><text y="4" fill="#EDF7F5">04</text><text y="48" fill="#8AA0BA">REFINE</text></g>
    </g>
    <path class="flow" d="M278 217C278 238 50 238 50 217" stroke="#4E6684" stroke-width="2" stroke-dasharray="5 8"/>
    <text x="24" y="248" fill="#607895" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">repeat until the system earns trust</text>
  </g>

  <g transform="translate(782 96)">
    <rect width="380" height="278" rx="16" fill="#0B1728" stroke="#2A4260" stroke-width="2"/>
    <text x="24" y="36" fill="#FFB86B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">03 / WORKING SET</text>
    <text x="24" y="75" fill="#EDF7F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Tools within reach</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <g class="chip" transform="translate(24 98)"><rect width="95" height="34" rx="8" fill="#102D31" stroke="#57E3C3"/><text x="16" y="22" fill="#B9F5E8">PYTHON</text></g>
      <g class="chip" transform="translate(130 98)"><rect width="100" height="34" rx="8" fill="#1E2138" stroke="#A99FFF"/><text x="15" y="22" fill="#D9D4FF">PYTORCH</text></g>
      <g class="chip" transform="translate(241 98)"><rect width="115" height="34" rx="8" fill="#2D241B" stroke="#FFB86B"/><text x="13" y="22" fill="#FFD5A3">TRANSFORMERS</text></g>
      <g class="chip" transform="translate(24 144)"><rect width="105" height="34" rx="8" fill="#102D31" stroke="#57E3C3"/><text x="16" y="22" fill="#B9F5E8">FASTAPI</text></g>
      <g class="chip" transform="translate(140 144)"><rect width="118" height="34" rx="8" fill="#1E2138" stroke="#A99FFF"/><text x="14" y="22" fill="#D9D4FF">POSTGRESQL</text></g>
      <g class="chip" transform="translate(269 144)"><rect width="87" height="34" rx="8" fill="#2D241B" stroke="#FFB86B"/><text x="18" y="22" fill="#FFD5A3">REDIS</text></g>
      <g class="chip" transform="translate(24 190)"><rect width="92" height="34" rx="8" fill="#102D31" stroke="#57E3C3"/><text x="16" y="22" fill="#B9F5E8">DOCKER</text></g>
      <g class="chip" transform="translate(127 190)"><rect width="75" height="34" rx="8" fill="#1E2138" stroke="#A99FFF"/><text x="21" y="22" fill="#D9D4FF">GCP</text></g>
      <g class="chip" transform="translate(213 190)"><rect width="72" height="34" rx="8" fill="#2D241B" stroke="#FFB86B"/><text x="14" y="22" fill="#FFD5A3">AZURE</text></g>
      <g class="chip" transform="translate(296 190)"><rect width="60" height="34" rx="8" fill="#102D31" stroke="#57E3C3"/><text x="16" y="22" fill="#B9F5E8">AWS</text></g>
    </g>
    <text x="24" y="248" fill="#607895" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">model -> data -> api -> infrastructure</text>
    <rect class="cursor" x="352" y="238" width="3" height="13" fill="#57E3C3"/>
  </g>
</svg>
