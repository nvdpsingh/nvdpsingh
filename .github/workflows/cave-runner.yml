name: Generate Cave Runner

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/cave-runner/**"
      - ".github/workflows/cave-runner.yml"

permissions:
  contents: write

concurrency:
  group: cave-runner-output
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Test Cave Runner
        run: node --test scripts/cave-runner/render.test.mjs

      - name: Generate light and dark games
        run: node scripts/cave-runner/generate.mjs --out-dir dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Validate generated files
        run: |
          test -s dist/cave-runner-contribution-graph.svg
          test -s dist/cave-runner-contribution-graph-dark.svg
          grep -q 'data-theme="light"' dist/cave-runner-contribution-graph.svg
          grep -q 'data-theme="dark"' dist/cave-runner-contribution-graph-dark.svg
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          for path in Path("dist").glob("*.svg"):
              root = ET.parse(path).getroot()
              source = path.read_text(encoding="utf-8")
              for element in root.iter():
                  tag = element.tag.rsplit("}", 1)[-1].lower()
                  if tag == "script":
                      raise SystemExit(f"{path}: script elements are not allowed")
                  for attribute, value in element.attrib.items():
                      name = attribute.rsplit("}", 1)[-1].lower()
                      if name in {"href", "src"} and re.match(r"\s*(?:https?:)?//", value, re.I):
                          raise SystemExit(f"{path}: external resource is not allowed")
              if re.search(r"url\(\s*['\"]?\s*(?:https?:)?//", source, re.I):
                  raise SystemExit(f"{path}: external CSS resource is not allowed")
          PY

      - name: Publish game assets
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
